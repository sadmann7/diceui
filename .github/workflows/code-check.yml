name: Code check

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_COLOR: 3
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  format:
    runs-on: ubuntu-latest
    name: Format
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: ./.github/setup

      - name: Check formatting
        run: pnpm format:check

  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: ./.github/setup

      - name: Build packages
        run: pnpm build --filter=!docs

  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: ./.github/setup

      - run: pnpm lint

      - name: Check the tablecn copies
        run: pnpm --filter=docs tablecn:check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: ./.github/setup

      - name: Test
        run: pnpm test

  typecheck:
    runs-on: ubuntu-latest
    name: Typecheck
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: ./.github/setup

      # The docs import the generated style maps and ui-rtl, which build:styles writes.
      - name: Build registry styles
        run: pnpm --filter=docs build:styles

      - name: Typecheck
        run: pnpm typecheck
